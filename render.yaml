# One-command deploy to Render (long-running web service; supports SSE + multi-minute runs).
# Push this repo to GitHub, then: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: commodity-research
    runtime: node
    plan: starter
    # NOTE: do NOT set NODE_ENV=production as an env var here - it would make
    # `npm install` omit devDependencies (vite/tsx/react are devDeps at build time).
    # `npm run start` sets NODE_ENV=production via cross-env, which is all vite-express needs.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRED_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
